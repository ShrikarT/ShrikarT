name: Update profile telemetry

on:
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Refresh telemetry data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render_telemetry.py

      - name: Commit refreshed telemetry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lang-card.svg assets/telemetry.svg

          if git diff --cached --quiet; then
            echo "Telemetry is already current."
            exit 0
          fi

          git commit -m "chore: refresh profile telemetry"
          git push
