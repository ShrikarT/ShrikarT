name: Update profile activity graph

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/activity-graph.yml
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity-graph
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@6411849745757299611a795fef822a31ca8d1d02 # v1
        with:
          username: ShrikarT
          options: >-
            bg_color=0A0A0A&color=ffffff&title_color=ffffff&line=ffffff&point=ffffff&area=true&area_color=333333&hide_border=true&custom_title=SHIPPING%20VELOCITY
          output_path: assets/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed graph
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg

          if git diff --cached --quiet; then
            echo "Activity graph is already current."
            exit 0
          fi

          git commit -m "chore: refresh profile activity graph"
          git push
